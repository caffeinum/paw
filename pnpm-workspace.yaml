# pnpm 11 reads its settings here (the package.json "pnpm" field and pnpm-specific .npmrc
# keys are no longer honored).
#
# packages: paw is the root package; the two endpoint packages are workspace members so
#   `@cotal-ai/endpoint-core` resolves for endpoint-telegram (its `workspace:*` dep) across tsx,
#   the test runners, and typecheck. After pulling this branch, run `pnpm install` once so pnpm
#   links endpoint-core into node_modules/@cotal-ai/ (the launchd telegram daemon needs it on the
#   module path). NEVER commit a node_modules symlink for this — the workspace link is the only
#   sanctioned mechanism.
#
# allowBuilds.esbuild: false — explicitly decline to run esbuild's postinstall build script
#   (same security as the global ignore-scripts policy: no dependency scripts execute). Stating
#   the decision stops pnpm escalating the skipped build to a fatal error. esbuild runs from its
#   prebuilt platform binary, so tsx still works.
# verifyDepsBeforeRun: false — don't auto-reinstall before `pnpm <script>`. Our deps are link:ed
#   from a local cotal checkout and never drift from a registry; the check otherwise re-runs
#   install and inherits the esbuild build decision as a fatal error.
packages:
  - "."
allowBuilds:
  esbuild: false
# patchedDependencies — TEMPORARY. (The #2401 hub patch is gone: cotal 0.82.0 ships
#   `serveClaudeSession` from `@cotal-ai/connector-claude-code/mcp` upstream, Cotal-AI/Cotal#3921.)
# (The '@cotal-ai/core' patch is gone too, at 0.170: the meta-validator fix shipped upstream, and upstream's
#   #4123 stops an endpoint publishing a KV watch delete its cred can't make, so the CONSUMER.DELETE grant
#   paw added on the presence/channels KV is no longer needed. → docs/notes/cotal-dependency.md#cotal-01700)
# '@nats-io/transport-node' + '@cotal-ai/connector-claude-code' — reconnect fix: nats.js's stale-connection
#   close awaited a goodbye write that never completes when the link dies with the socket's write buffer
#   backed up, so the client never reconnected until the kernel killed the socket (~15 min in a sandbox
#   VM). Bounded to 1s. The connector's dist/mcp.cjs (the per-agent cotal MCP server) BUNDLES its own copy
#   of the transport, hence two patches; re-key the connector one on every cotal bump. nats.js 3.5.0 ships the
#   fix; drop both once cotal pins it. Since 0.170 mcp.cjs is MINIFIED (one line is 537 KB), so the connector
#   patch file is ~1.3 MB: regenerate it with `pnpm patch` + exact-once string replacements, not by hand.
#   → docs/notes/sandbox.md#mesh-reconnect
#   The connector patch ALSO carries paw's Stop hook change (beads-y1eg): a turn ending with background work open
#   reports `working` + "background: …" via PAW_BACKGROUND_PROBE (src/background-scan.ts) instead of idle.
#   → docs/notes/office.md ("The agent's own Stop hook says it"); propose upstream, then drop the hunk.
verifyDepsBeforeRun: false
# minimumReleaseAgeExclude — the operator explicitly asked for the latest cotal, 0.170.0, on 2026-11-19,
#   inside the global 7-day minimum-release-age window. Exempted by EXACT version only (every other package
#   and any other @cotal-ai version still waits out the gate). Safe to delete after 2026-11-26
#   (0.170.0 published 2026-11-19T04:33Z, + 7d).
minimumReleaseAgeExclude:
  - '@cotal-ai/cli@0.170.0'
  - '@cotal-ai/cmux@0.170.0'
  - '@cotal-ai/connector-claude-code@0.170.0'
  - '@cotal-ai/connector-codex@0.170.0'
  - '@cotal-ai/connector-hermes@0.170.0'
  - '@cotal-ai/connector-opencode@0.170.0'
  - '@cotal-ai/core@0.170.0'
  - '@cotal-ai/manager@0.170.0'
  - '@cotal-ai/seat@0.170.0'
  - '@cotal-ai/tmux@0.170.0'
  - '@cotal-ai/workspace@0.170.0'
patchedDependencies:
  '@cotal-ai/connector-claude-code@0.170.0': patches/@cotal-ai__connector-claude-code@0.170.0.patch
  '@nats-io/transport-node@3.4.0': patches/@nats-io__transport-node@3.4.0.patch
