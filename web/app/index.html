<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paw</title>
<!-- Favicon as an inline SVG data URI: no extra file, no route, no request — and it survives the
     daemon serving the page from a different directory. Drawn as PATHS rather than the 🐾 emoji,
     because emoji render differently per platform and some tab bars flatten them to a grey box.
     A filled tile in paw's own purple, not a bare glyph: a transparent icon disappears into a dark
     tab strip on one theme or a light one on the other, and the tab is exactly where you need to
     find it at a glance. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233F0E40'/%3E%3Cg fill='%23ffffff'%3E%3Cellipse cx='11' cy='10.6' rx='3.1' ry='4'/%3E%3Cellipse cx='21' cy='10.6' rx='3.1' ry='4'/%3E%3Cellipse cx='5.4' cy='17.2' rx='2.7' ry='3.4'/%3E%3Cellipse cx='26.6' cy='17.2' rx='2.7' ry='3.4'/%3E%3Cpath d='M16 16.4c4.2 0 7.5 3.3 7.5 6.7 0 2.6-2 4.3-4.6 4.3-1.4 0-2.2-.6-2.9-.6s-1.5.6-2.9.6c-2.6 0-4.6-1.7-4.6-4.3 0-3.4 3.3-6.7 7.5-6.7z'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Slack's own palette. Aubergine sidebar, white content, Lato-ish system stack.
     Dark theme mirrors Slack's, so the viewer's toggle still works. */
  :root {
    --sidebar:      #3F0E40;
    --sidebar-hi:   #350D36;
    --sidebar-txt:  #BCABBC;
    --sidebar-str:  #FFFFFF;
    --selected:     #1164A3;
    --content:      #FFFFFF;
    --content-alt:  #F8F8F8;
    --line:         #DDDDDD;
    --txt:          #1D1C1D;
    --txt-dim:      #616061;
    --link:         #1264A3;
    --green:        #2BAC76;
    --amber:        #ECB22E;
    --red:          #E01E5A;
    --code-bg:      #F6F6F6;
    --code-txt:     #E01E5A;
    --font: "Slack-Lato", "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: Monaco, Menlo, Consolas, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sidebar:#19171D; --sidebar-hi:#27242C; --sidebar-txt:#ABABAD; --sidebar-str:#FFFFFF;
      --selected:#1164A3; --content:#1A1D21; --content-alt:#222529; --line:#35373B;
      --txt:#D1D2D3; --txt-dim:#ABABAD; --link:#1D9BD1; --code-bg:#232529; --code-txt:#E01E5A;
    }
  }
  :root[data-theme="dark"] {
    --sidebar:#19171D; --sidebar-hi:#27242C; --sidebar-txt:#ABABAD; --sidebar-str:#FFFFFF;
    --selected:#1164A3; --content:#1A1D21; --content-alt:#222529; --line:#35373B;
    --txt:#D1D2D3; --txt-dim:#ABABAD; --link:#1D9BD1; --code-bg:#232529; --code-txt:#E01E5A;
  }
  :root[data-theme="light"] {
    --sidebar:#3F0E40; --sidebar-hi:#350D36; --sidebar-txt:#BCABBC; --sidebar-str:#FFFFFF;
    --selected:#1164A3; --content:#FFFFFF; --content-alt:#F8F8F8; --line:#DDDDDD;
    --txt:#1D1C1D; --txt-dim:#616061; --link:#1264A3; --code-bg:#F6F6F6; --code-txt:#E01E5A;
  }

  * { box-sizing: border-box; }
  /* The PAGE must not scroll — only the panes inside it.
     `.app` is 100vh, so the document has nothing to scroll, but macOS still rubber-bands the whole
     window past its own edge on a trackpad flick: the header and sidebar lift away and slide back,
     which reads as the app coming loose from the frame. `overscroll-behavior: none` on the document
     refuses the bounce; `contain` on each scrolling pane stops a flick that reaches the end of the
     message list from chaining outward into the document at all. Height is pinned on html AND body
     because 100vh on a descendant does not by itself stop the document being scrollable. */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { margin:0; font-family: var(--font); font-size:15px; line-height:1.46668;
         color: var(--txt); background: var(--content); -webkit-font-smoothing: antialiased; }

  .app { height:100vh; display:grid; grid-template-rows:38px 1fr; }

  /* ── top bar ─────────────────────────────────────────────────────────── */
  .top { background: var(--sidebar); display:flex; align-items:center; justify-content:center;
         color: var(--sidebar-txt); font-size:13px; gap:10px; position:relative; }
  /* The centre pill was printing the space name twice. With forty agents in the sidebar the useful
     thing in that shape is what its shape already suggests — a filter. Connection trouble takes over
     the placeholder, because a box you can type in is also the most visible place to say the feed is
     stale. */
  .search { background: rgba(255,255,255,.12); border:none; border-radius:6px; width:46%; max-width:640px;
            text-align:center; padding:3px 8px; color:#E8E8E8; font-size:13px; font-family:inherit;
            outline:none; }
  .search::placeholder { color:#C9BFC9; opacity:1; }
  .search:focus { background: rgba(255,255,255,.20); }
  .search.stale::placeholder { color:var(--amber); }
  .search::-webkit-search-cancel-button { filter:invert(1); opacity:.5; }
  .theme { position:absolute; right:12px; display:flex; gap:2px;
           background:rgba(255,255,255,.10); border-radius:6px; padding:2px; }
  .theme button { background:none; border:none; border-radius:4px; cursor:pointer;
                  color:#D9D0D9; font-size:12px; line-height:1; padding:3px 7px; font-family:inherit; }
  .theme button:hover { background:rgba(255,255,255,.12); color:#fff; }
  .theme button[aria-pressed="true"] { background:rgba(255,255,255,.22); color:#fff; }

  /* Width is a custom property so the drag handle can move it without touching the rule. */
  .body-grid { display:grid; grid-template-columns:var(--side-w, 260px) 1fr; min-height:0; position:relative; }
  /* A RIGHT sidebar carries the focused agent's task list next to its chat (operator's call,
     2026-08-26) — the list used to REPLACE the chat as a mode; now they sit side by side. */
  .body-grid.withaside { grid-template-columns:var(--side-w, 260px) 1fr 320px; }
  .aside { border-left:1px solid var(--line); background:var(--content-alt); color:var(--txt); overflow-y:auto; padding:14px 16px 40px; min-width:0; }
  .aside[hidden] { display:none; }
  .aside .athead { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; white-space:nowrap; font-size:13px; color:var(--txt); }
  .aside .athead .atn { color:var(--txt-dim); font-size:12px; }
  .aside .athead a { margin-left:auto; font-size:12px; }
  .aside .atgroup { margin:12px 0 4px; }
  .aside .elt[data-ghost]:empty::before { content:"add a task…"; opacity:.4; }
  .aside .bsi { font-size:13px; padding:2px 0; }
  .grip { position:absolute; top:0; bottom:0; left:calc(var(--side-w, 260px) - 3px); width:6px;
          cursor:col-resize; z-index:5; }
  .grip:hover, .grip.dragging { background:var(--selected); opacity:.5; }
  body.resizing { cursor:col-resize; user-select:none; }

  /* ── sidebar ─────────────────────────────────────────────────────────── */
  .side { background: var(--sidebar); color: var(--sidebar-txt); overflow-y:auto; padding-bottom:20px; }
  .ws { display:flex; align-items:center; gap:8px; padding:14px 16px 10px; color:var(--sidebar-str);
        font-weight:900; font-size:18px; letter-spacing:-.2px; }
  .ws small { font-weight:400; font-size:12px; color:var(--sidebar-txt); }
  /* A section header is now a CONTROL, so it says so: pointer, hover, and a chevron that states the
     direction the click will go. `user-select:none` because a fold you trigger by double-clicking a
     word should not also select the word. */
  .sec { padding:14px 16px 4px; font-size:13px; font-weight:700; color:var(--sidebar-txt);
         display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .sec:hover { color:var(--sidebar-active-txt, #fff); }
  .sec .chev { font-size:9px; opacity:.7; width:9px; display:inline-block;
               transition:transform .12s ease; }
  .sec.folded .chev { transform:rotate(-90deg); }
  /* The count only appears when the section is FOLDED: open, the rows are right there and a number is
     noise; folded, it is the only thing saying what you have hidden. */
  .seccount { margin-left:auto; font-weight:400; opacity:.55; font-size:12px; }
  .row { display:flex; align-items:center; gap:8px; padding:4px 16px 4px 18px; font-size:15px;
         cursor:pointer; color:var(--sidebar-txt); }
  .row:hover { background: var(--sidebar-hi); }
  .row.active { background: var(--selected); color:#fff; font-weight:700; }
  .row.unread { color: var(--sidebar-str); font-weight:900; }
  .row .hash { opacity:.7; width:12px; text-align:center; }
  .pip.fail { background: var(--red, #d64545); box-shadow: 0 0 0 2px rgba(214,69,69,.25); }
  .fail { color: var(--amber, #d29922); }
  .failnote { margin: 10px 22px 4px; padding: 8px 12px; border-left: 3px solid var(--amber, #d29922); background: var(--content-alt); font-size: 13px; }
  /* A channel row's ▸ unfolds the agents in it; nested rows indent under the channel name. */
  .row .chev { font-size:10px; width:10px; opacity:.6; display:inline-block; transition:transform .12s; cursor:pointer; }
  .row .chev.open { transform:rotate(90deg); }
  .row .chev:hover { opacity:1; }
  .row.sub { padding-left:44px; font-size:14px; }
  .row.sub.nonagent { cursor:default; opacity:.7; }
  .row.sub.nonagent:hover { background:none; }
  .row.sub.addag { opacity:.75; }
  /* search results: one row per hit, header line then the snippet */
  .ssec { padding:14px 22px 4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.6; }
  .srch { padding:8px 22px; border-bottom:1px solid var(--line); cursor:pointer; }
  .srch:hover { background: var(--content-alt); }
  .srch .sh { font-size:12px; opacity:.75; margin-bottom:2px; }
  .srch .sb { font-size:14px; }
  .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pip { width:9px; height:9px; border-radius:50%; flex:none; }
  .pip.on { background: var(--green); }
  .pip.busy { background: var(--amber); }
  .pip.off { border:1.5px solid currentColor; opacity:.55; }
  .count { background:#CD2553; color:#fff; font-size:12px; font-weight:700;
           border-radius:9px; padding:0 7px; line-height:18px; }

  /* ── channel header ──────────────────────────────────────────────────── */
  .main { display:grid; grid-template-rows:auto 1fr auto; min-height:0; background: var(--content); position:relative; }
  .chead { border-bottom:1px solid var(--line); padding:0 20px; height:49px;
           display:flex; align-items:center; gap:10px; }
  .chead h1 { font-size:18px; font-weight:900; margin:0; letter-spacing:-.2px; }
  .chead .topic { color:var(--txt-dim); font-size:13px; border-left:1px solid var(--line);
                  padding-left:10px; margin-left:2px; }
  .chead .right { margin-left:auto; display:flex; gap:8px; }

  /* ── messages ────────────────────────────────────────────────────────── */
  .msgs { overflow-y:auto; padding:20px 0 12px; min-height:0; }
  .divider { display:flex; align-items:center; gap:0; margin:14px 20px; position:relative; }
  .divider::before { content:""; flex:1; height:1px; background:var(--line); }
  .divider span { position:absolute; left:50%; transform:translateX(-50%); background:var(--content);
                  border:1px solid var(--line); border-radius:24px; padding:2px 14px;
                  font-size:13px; font-weight:700; color:var(--txt); }
  .newline { display:flex; align-items:center; margin:16px 20px 6px; }
  .newline::before { content:""; flex:1; height:1px; background:var(--red); }
  .newline span { color:var(--red); font-size:13px; font-weight:700; padding-left:10px; }

  .m { display:grid; grid-template-columns:36px 1fr; gap:8px; padding:8px 20px; }
  .m:hover { background: var(--content-alt); }
  .m.cont { padding-top:2px; padding-bottom:2px; }
  /* "Where I left off." A rule across the full width with the label riding on it — the line is what
     you catch scanning, the word only confirms it. Red because this is the one marker that means
     "start here", and it must not read as another separator. */
  .newmark { display:flex; align-items:center; gap:8px; padding:6px 20px 2px; }
  .newmark::after { content:""; flex:1; height:1px; background:var(--red); }
  .newmark span { color:var(--red); font-size:11px; font-weight:800; letter-spacing:.06em;
                  text-transform:uppercase; }
  .av { width:36px; height:36px; border-radius:4px; display:flex; align-items:center;
        justify-content:center; color:#fff; font-weight:700; font-size:15px; }
  .m.cont .av { visibility:hidden; height:0; }
  .hdr { display:flex; align-items:baseline; gap:8px; margin-bottom:1px; }
  .hdr .name { font-weight:900; font-size:15px; color:var(--txt); }
  .hdr .time { font-size:12px; color:var(--txt-dim); }
  /* Archive control: hidden until the row is hovered, because a 56-agent list with a button on every
     row is a list of buttons. It sits before the count so the timestamps stay in one column. */
  .row .arch { opacity:0; font-size:12px; color:var(--sidebar-txt); padding:0 4px; border-radius:4px; }
  .row:hover .arch { opacity:.65; }
  .row .arch:hover { opacity:1; background:rgba(255,255,255,.14); }
  /* A revealed archived row is dimmed, so "shown because you asked" never looks like "not archived". */
  .row.filed .nm { opacity:.55; font-style:italic; }
  /* A PR is TWO lines because it carries two different kinds of fact: what it is (status, number,
     title) and where it came from (agent, branch, size). Cramming them into one row is what makes the
     branch name truncate to `feat/billing-page-stripe-pri…` and take the title with it. */
  /* The quote button follows the SELECTION, not a row — it appears where you finished dragging, which
     is where your eye already is. Fixed positioning because the message list scrolls under it. */
  .quotebtn { position:fixed; z-index:40; font:inherit; font-size:12px; font-weight:600;
              background:var(--content); color:var(--txt); border:1px solid var(--line);
              border-radius:6px; padding:4px 10px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.28); }
  .quotebtn:hover { background:var(--content-alt); }
  /* Jumping to a message marks it, briefly. A silent scroll into a wall of text leaves you hunting for
     the line you clicked. */
  .m.flash { background:var(--content-alt); border-radius:8px;
             animation:flashfade 1.6s ease-out forwards; }
  @keyframes flashfade { 0% { background:var(--accent-soft, rgba(120,160,90,.22)); } 100% { background:transparent; } }
  /* A name/chip that opens a conversation looks like it does something. */
  .hdr .who { cursor:pointer; }
  .hdr .who:hover { text-decoration:underline; }
  .time.jump { cursor:pointer; }
  .time.jump:hover { text-decoration:underline; }
  /* Source-faithful spacing in the TRACE: the blank lines are emitted by md({gaps:true}) as .mdgap, so
     the blocks themselves carry NO margin of their own. Two sources of spacing would double it, and
     the whole point is to reproduce what the author wrote — a fenced block flush against a paragraph
     stays flush, exactly as Claude Code shows it. */
  .trace-md p, .trace-md pre, .trace-md ul, .trace-md ol, .trace-md h3, .trace-md h4,
  .trace-md h5, .trace-md h6 { margin:0; }
  .trace-md ul, .trace-md ol { padding-left:22px; }
  .mdgap { height:.72em; }
  /* The code block keeps its box (it earns one in a browser) but not its float — the margin is the
     .mdgap's job now. */
  .trace-md pre { padding:6px 10px; }
  .secbtn { cursor:pointer; }
  .secbtn:hover { opacity:.85; }
  #taskspad { position:absolute; inset:0; z-index:30; background:var(--content); display:flex; flex-direction:column; overflow:hidden; }
  /* An author `display` BEATS the [hidden] attribute's UA display:none — without this the pad is
     painted over every conversation from page load while .hidden dutifully toggles underneath
     (the entire "chats don't open / ✕ does nothing" evening of 2026-08-25). */
  #taskspad[hidden] { display:none; }
  #board { position:absolute; inset:0; z-index:30; background:var(--content); display:flex; flex-direction:column; overflow:hidden; }
  #board[hidden] { display:none; }
  #village { position:absolute; inset:0; z-index:30; background:var(--content); display:flex; flex-direction:column; overflow:hidden;
             --vbg:var(--content); --vink:var(--txt); --vdim:var(--txt-dim); --vfold:color-mix(in srgb, var(--txt) 55%, transparent); }
  #village[hidden] { display:none; }
  #palette { position:fixed; inset:0; z-index:100; background:rgba(20,16,24,.32); display:flex; align-items:flex-start; justify-content:center; }
  #palette[hidden] { display:none; }
  #palette .palbox { margin-top:12vh; width:min(560px,92vw); max-height:64vh; background:var(--content); color:var(--txt); border:1px solid var(--line); border-radius:12px; box-shadow:0 24px 64px rgba(0,0,0,.35); display:flex; flex-direction:column; overflow:hidden; }
  #palette .palq { border:0; outline:0; padding:14px 16px; font-size:15px; background:transparent; color:var(--txt); border-bottom:1px solid var(--line); }
  #palette .pallist { overflow-y:auto; padding:6px; }
  #palette .palrow { display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13.5px; }
  #palette .palrow.sel { background:var(--selected); color:#fff; }
  #palette .palrow.sel .palhint, #palette .palrow.sel .palhash, #palette .palrow.sel .palview { color:rgba(255,255,255,.8); }
  #palette .pallabel { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #palette .palhint { color:var(--txt-dim); font-size:12px; }
  #palette .palhash, #palette .palview { color:var(--txt-dim); width:14px; text-align:center; font-weight:700; }
  #palette .paldot { width:8px; height:8px; border-radius:50%; background:#9aa0a6; flex:none; }
  #palette .paldot.on { background:#2ecc71; } #palette .paldot.busy { background:#e0a23a; } #palette .paldot.off { background:#9aa0a6; }
  #palette .palempty { padding:14px 12px; color:var(--txt-dim); font-size:13px; }
  #village .villhead { display:flex; align-items:baseline; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); flex:none; }
  #village .vtitle { font-weight:700; font-size:15px; color:var(--txt); }
  #village .vhint { font-size:11.5px; color:var(--txt-dim); }
  #village .villscroll { flex:1; overflow:auto; position:relative; background-image:radial-gradient(color-mix(in srgb, var(--txt) 8%, transparent) 1px, transparent 1px); background-size:40px 40px; }
  #village svg text { font-family:inherit; }
  #village .villtip { position:absolute; z-index:5; max-width:280px; background:#1f1826; color:#efe8f5; border-radius:10px; padding:9px 11px; font-size:12px; box-shadow:0 8px 24px rgba(0,0,0,.28); pointer-events:none; }
  #village .villtip .vh { display:flex; justify-content:space-between; gap:12px; color:#c6b5d6; margin-bottom:4px; }
  #village .villtip .vh b { color:#fff; }
  #village .villtip .vmsg { line-height:1.45; white-space:pre-wrap; overflow:hidden; max-height:96px; }
  #village .villtip .vmuted { color:#a894ba; }
  #village .villtip .vft { margin-top:6px; color:#a894ba; font-size:11px; }
  #bcols { display:flex; gap:14px; padding:14px 18px 24px; overflow-x:auto; flex:1; align-items:flex-start; }
  .bcol { flex:0 0 280px; max-width:280px; border-radius:12px; padding:10px; background:rgba(128,128,128,.08); border:2px solid transparent; transition:border-color .15s, background .15s; }
  .bcol.bover { border-color:rgba(74,158,218,.6); border-style:dashed; background:rgba(74,158,218,.07); }
  .bhead { display:flex; align-items:center; gap:8px; padding:2px 4px 8px; font-size:13px; font-weight:600; }
  .bdot { width:10px; height:10px; border-radius:3px; background:#8a8f98; }
  .bdot.todo { background:#4a6fda; } .bdot.prog { background:#d9a23a; } .bdot.blocked { background:#d05548; } .bdot.done { background:#4caf7d; }
  .bcount { margin-left:auto; font-size:11px; opacity:.6; background:rgba(128,128,128,.15); border-radius:10px; padding:1px 8px; }
  .bcards { display:flex; flex-direction:column; gap:8px; min-height:60px; }
  /* Cards use the CONTENT palette — the sidebar's aubergine made them unreadable in light mode. */
  .bcard { border-radius:8px; padding:10px; background:var(--content-alt); color:var(--txt); border:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.12); cursor:grab; transition:transform .12s, box-shadow .12s; }
  .bcard .bd { color:var(--txt-dim); }
  #bmodal { position:absolute; inset:0; z-index:50; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; }
  .mbox { width:min(720px, 100%); background:var(--content); color:var(--txt); border:1px solid var(--line); border-radius:14px; padding:18px 22px 20px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .mhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .mstatus { display:flex; gap:6px; flex-wrap:wrap; }
  .mst { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--content-alt); color:var(--txt); border-radius:20px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .mst.on { border-color:var(--selected); box-shadow:0 0 0 1px var(--selected) inset; }
  .mclose { margin-left:auto; border:0; background:none; color:inherit; opacity:.6; cursor:pointer; font-size:14px; }
  .mtitle { font-size:20px; font-weight:700; margin:6px 0 8px; line-height:1.3; }
  .mdesc { font-size:13px; line-height:1.55; white-space:pre-wrap; margin-bottom:12px; }
  .mdesc.dim, .mbox .dim { color:var(--txt-dim); font-size:12px; }
  .mmeta { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:4px 16px; font-size:12px; margin-bottom:12px; }
  .mrow { display:flex; gap:8px; } .mk { color:var(--txt-dim); min-width:72px; }
  .msec { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--txt-dim); margin:14px 0 6px; }

     input goes monospace — the type you write commands in — and the accent says which mode you're in
     before you commit to it, not after. */
  .comp.bang .box { border-color:var(--red); }
  /* The `!` becomes the MODE, not text you keep looking at — so it is consumed and replaced by a `$`
     that belongs to the composer rather than to what you typed. Aligned to the first line of the
     textarea, not centred, so it stays put as the box grows. */
  .input { display:flex; align-items:flex-start; gap:8px; }
  /* The mark must share the textarea's FONT and LINE-HEIGHT, and carry no padding of its own: the
     wrapper already pads the row, so a second 9px pushed the `$` a whole line below the command it
     belongs to. Matching the metrics is what puts the two baselines on the same line. */
  .bangmark { display:none; flex:none; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
              font-size:14px; line-height:1.46; font-weight:700; color:var(--red); user-select:none; }
  .comp.bang .bangmark { display:block; }
  .comp.bang textarea { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; }
  .comp.bang .hint-to { color:var(--red); font-weight:700; }
  body.dropping::after { content:"drop to attach"; position:fixed; inset:auto 0 24px 0; text-align:center;
                         color:var(--link); font-size:13px; font-weight:700; pointer-events:none; }
  /* A wide table scrolls in ITS OWN container — the page body must never scroll sideways, and a
     results table with eight columns is exactly the content that would otherwise do it. */
  .tablewrap { overflow-x:auto; margin:8px 0; max-width:100%; }
  .txt table { border-collapse:collapse; font-size:13px; line-height:1.45; }
  .txt th, .txt td { border:1px solid var(--line); padding:4px 9px; text-align:left; vertical-align:top;
                     white-space:nowrap; }
  .txt th { background:var(--content-alt); font-weight:700; }
  /* Digits line up in columns, which is most of why you put numbers in a table at all. */
  .txt td { font-variant-numeric: tabular-nums; }
  .txt tbody tr:hover { background:var(--content-alt); }
  .att { display:block; max-width:min(460px, 100%); max-height:340px; width:auto; height:auto;
         margin-top:6px; border:1px solid var(--line); border-radius:8px; object-fit:contain; }

  /* Scrollbars.
     The platform default is a wide light track that reads as a UI element in its own right — against
     the dark ground it was the loudest thing on screen, and it frames the message pane like a border
     nobody asked for. Both syntaxes are set: the standard properties are what Firefox and newer Chrome
     honour, ::-webkit-* is what everything else does, and neither alone covers the browsers this runs in.
     Colours come from the theme tokens so this follows light/dark rather than pinning a grey that only
     works on one of them. */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 6px;
    /* A transparent border with background-clip keeps the thumb visually narrow while leaving the
       full 10px as the grab target — a 4px-wide bar looks right and is miserable to actually catch. */
    border: 3px solid transparent;
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--txt-dim); background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  /* The sidebar has its own ground, so the token that reads as "a line" on the content background is
     invisible on aubergine. */
  .side { scrollbar-color: rgba(255,255,255,.22) transparent; }
  .side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.22); background-clip: content-box; }
  .side::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.38); background-clip: content-box; }
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <input class="search" id="conn" type="search" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" spellcheck="false" placeholder="connecting…">
    <div class="theme" role="group" aria-label="Colour theme">
      <button data-set="light" title="Light">☀</button>
      <button data-set="system" title="Match system" aria-pressed="true">◐</button>
      <button data-set="dark" title="Dark">☾</button>
    </div>
  </div>

  <div class="body-grid" id="grid">
    <div class="grip" id="grip" title="drag to resize"></div>
    <nav class="side">
      <div class="ws">paw <small>&nbsp;<span id="spaceName">…</span></small></div>
      <div id="activity"></div>
      <div id="tasksRow"></div>
      <div id="boardRow"></div>
      <div id="villageRow"></div>
      <div class="sec" data-fold="channels"><span class="chev">▾</span>Channels</div>
      <div id="channels"></div>
      <div class="sec" data-fold="prs" id="prsHead" hidden><span class="chev">▾</span>PRs<span class="seccount" id="prsCount"></span></div>
      <div id="prs"></div>
      <div class="sec" data-fold="agents"><span class="chev">▾</span>Agents<span class="seccount" id="agentCount"></span></div>
      <div id="agents"></div>
      <div class="sec" data-fold="archived" id="archivedHead" hidden><span class="chev">▾</span>Archived<span class="seccount" id="archivedCount"></span></div>
      <div id="archived"></div>
    </nav>

    <main class="main" id="main">
      <div id="board" hidden>
        <div class="padhead"><span class="padtitle">Board</span><span class="padhint">drag cards between columns · drop on Done to close · + add a card</span></div>
        <div id="bcols"></div>
      </div>
      <div id="taskspad" hidden>
        <div class="padhead">
          <span class="padtitle">Tasks</span>
          <span class="padhint">enter = new task · click bullet = status · backspace on empty = remove · esc closes</span>
          <button id="padclose" title="close">✕</button>
        </div>
        <div id="padrows"></div>
      </div>
      <div id="village" hidden></div>
      <div class="chead">
        <h1 id="title">inbox</h1>
        <span class="pip off" id="pip" style="width:8px;height:8px"></span>
        <span class="topic chat-only" id="topic"></span>
        <span class="topic trace-only" id="traceTopic"></span>
        <div class="right">
          <div class="modes" role="group" aria-label="View">
            <button data-mode="chat" aria-pressed="true">Chat</button>
            <button data-mode="trace" aria-pressed="false">Trace</button>
          </div>
        </div>
      </div>

      <div class="msgs" id="msgs"></div>
      <div class="tbody" id="tbody"></div>

      <div class="comp" id="comp">
        <div class="box">
          <div class="input"><span class="bangmark" id="bangmark">$</span><textarea id="input" rows="1" autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore data-form-type="other" placeholder="message an agent — pick one on the left"></textarea></div>
          <div class="actions">
            <span id="sendTo" class="hint-to"></span>
            <button class="send" id="send">Send</button>
          </div>
        </div>
        <div class="pending" id="pending"></div>
        <div class="hint" id="hint">⏎ send · ⇧⏎ newline · drop or ⌘V an image</div>
      </div>
    </main>
    <aside class="aside" id="aside" hidden></aside>
  </div>
</div>
<div id="palette" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
