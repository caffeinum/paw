<!doctype html>
<html lang="en" data-screen="work">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibeOS — tide</title>
<style>
  :root { color-scheme:light dark;
    --bg:#F2F7F6; --band:#E4EFED; --ink:#0E2A33; --dim:#4C6A72; --acc:#0B6A87; --pebble:#FFFFFF; --line:#CFE0DD;
    --round:ui-rounded, "SF Pro Rounded", "Avenir Next", "Nunito", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0A1B21; --band:#0F252D; --ink:#DCEBEA; --dim:#8DAEB3; --acc:#5CC8E0; --pebble:#133038; --line:#1D3A43; } }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0A1B21; --band:#0F252D; --ink:#DCEBEA; --dim:#8DAEB3; --acc:#5CC8E0; --pebble:#133038; --line:#1D3A43; }
  :root[data-theme="light"] { color-scheme:light; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font:16px/1.55 var(--round); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  button, input, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:3px; }
  .screen { display:none; } html[data-screen="work"] #work, html[data-screen="new"] #new { display:block; }

  .top { max-width:760px; margin:0 auto; padding:54px 24px 18px; position:relative; }
  .top .newc { position:absolute; right:24px; top:24px; color:var(--acc); text-decoration:none; font-size:14px; font-weight:600; }
  h1 { font-size:54px; line-height:1; margin:0; font-weight:700; letter-spacing:-.02em; }
  .mission { color:var(--dim); font-size:18px; margin:12px 0 26px; max-width:30em; }
  .pebbles { display:flex; flex-wrap:wrap; gap:8px; }
  .peb { display:inline-flex; align-items:center; gap:7px; padding:5px 12px 5px 9px; border-radius:999px; background:var(--pebble); border:1px solid var(--line); font-size:13.5px; font-weight:600; }
  .peb i { width:9px; height:9px; border-radius:50%; border:2px solid var(--dim); }
  .peb i.live { background:var(--acc); border-color:var(--acc); }

  /* each agent is a tide band, separated by a wave */
  .wave { display:block; width:100%; height:28px; color:var(--band); }
  .wave path { animation:drift 14s ease-in-out infinite alternate; }
  @keyframes drift { to { transform:translateX(-40px); } }
  .band { background:var(--band); }
  .band + .wave.down { transform:scaleY(-1); }
  .tide { max-width:760px; margin:0 auto; padding:14px 24px 22px; }
  .tide h2 { font-size:15px; font-weight:700; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .tide h2 i { width:9px; height:9px; border-radius:50%; border:2px solid var(--dim); }
  .tide h2 i.live { background:var(--acc); border-color:var(--acc); }
  .bead { display:flex; align-items:center; gap:12px; padding:8px 12px; margin:0 -12px; border-radius:16px; cursor:pointer; transition:background .25s; }
  .bead:hover, .bead.sel { background:var(--pebble); }
  .st { width:16px; height:16px; border-radius:50%; flex:none; border:2px solid var(--dim); position:relative; }
  .st.prog { border-color:var(--acc); background:linear-gradient(0deg, var(--acc) 50%, transparent 50%); }
  .st.blocked { border-color:var(--ink); } .st.blocked::after { content:""; position:absolute; left:2px; right:2px; top:5px; height:2px; background:var(--ink); border-radius:2px; }
  .st.closed { background:var(--dim); }
  .bead.done .t { color:var(--dim); text-decoration:line-through; text-decoration-thickness:1px; }
  .stw { font-size:12.5px; color:var(--dim); margin-left:auto; white-space:nowrap; }
  .add { margin-top:6px; border:1px dashed var(--line); background:none; border-radius:999px; padding:4px 14px; color:var(--acc); font-weight:600; font-size:13.5px; cursor:pointer; }
  .addin { width:100%; margin-top:6px; border:1px solid var(--acc); border-radius:999px; background:var(--pebble); padding:7px 14px; outline:none; }

  /* bead drifts in from the right */
  #panel { position:fixed; top:12px; right:12px; bottom:12px; width:min(460px, calc(100% - 24px)); background:var(--pebble); border:1px solid var(--line); border-radius:28px; padding:28px; display:none; flex-direction:column; z-index:10; box-shadow:0 24px 60px rgba(4,30,38,.22); }
  #panel.on { display:flex; animation:float .45s cubic-bezier(.2,.8,.2,1); }
  @keyframes float { from { opacity:0; transform:translate(24px, 10px); } }
  #panel .x { position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--bg); cursor:pointer; font-size:18px; line-height:1; }
  #panel h3 { font-size:22px; line-height:1.25; margin:0 44px 8px 0; }
  #panel .meta { color:var(--dim); font-size:14px; display:flex; align-items:center; gap:8px; }
  #panel .desc { margin:18px 0 22px; white-space:pre-wrap; }
  #panel .scroll { flex:1; overflow:auto; }
  .cm { background:var(--bg); border-radius:18px 18px 18px 6px; padding:10px 14px; margin:0 0 10px; }
  .cm .w { font-size:12.5px; color:var(--dim); font-weight:600; }
  #panel textarea { width:100%; border:1px solid var(--line); border-radius:18px; background:var(--bg); padding:12px 14px; resize:none; outline:none; }
  #panel textarea:focus, .card input[type=text]:focus { border-color:var(--acc); }
  .btn { border:0; border-radius:999px; background:var(--acc); color:var(--bg); padding:9px 22px; font-weight:700; cursor:pointer; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }

  /* /new */
  .card { max-width:460px; margin:54px auto; padding:32px; background:var(--pebble); border:1px solid var(--line); border-radius:28px; }
  .card h1 { font-size:34px; }
  .card label.f { display:block; font-size:13px; color:var(--dim); font-weight:600; margin:22px 0 6px; }
  .card input[type=text] { width:100%; border:1px solid var(--line); border-radius:999px; background:var(--bg); padding:9px 16px; outline:none; }
  #picks { display:flex; flex-wrap:wrap; gap:8px; }
  .pick { cursor:pointer; } .pick input { position:absolute; opacity:0; pointer-events:none; }
  .pick span { display:inline-block; padding:6px 14px; border-radius:999px; border:1px solid var(--line); font-size:14px; font-weight:600; transition:all .2s; }
  .pick input:checked + span { background:var(--acc); border-color:var(--acc); color:var(--bg); }
  .pick input:focus-visible + span { outline:2px solid var(--acc); outline-offset:2px; }
  .card .row { display:flex; align-items:center; gap:14px; margin-top:28px; flex-wrap:wrap; }
  .card .row .dim { color:var(--dim); font-size:13.5px; }
  .card a { color:var(--acc); }
  #steps { list-style:none; padding:0; margin:18px 0 0; font-size:14px; }
  #steps li { padding:3px 0 3px 22px; position:relative; }
  #steps li::before { position:absolute; left:0; }
  #steps .ok::before { content:"●"; color:var(--acc); } #steps .bad::before { content:"✕"; color:#C2410C; } #steps .bad { color:#B4380A; }
  :root[data-theme="dark"] #steps .bad { color:#FF9F6B; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #steps .bad { color:#FF9F6B; } }
  .retry { border:0; background:none; color:var(--acc); text-decoration:underline; cursor:pointer; padding:0; }
  @media (prefers-reduced-motion:reduce) { .wave path, #panel.on { animation:none; } }
  @media (max-width:600px) {
    .top { padding:56px 18px 14px; } h1 { font-size:42px; } .mission { font-size:16px; }
    .tide { padding:12px 18px 18px; } .stw { display:none; }
    #panel { inset:auto 0 0 0; top:12vh; width:100%; border-radius:28px 28px 0 0; }
    .card { margin:20px 14px; padding:24px 20px; }
  }
</style>
</head>
<body>
<div id="work" class="screen"><div class="top"><a class="newc" href="#new" data-go="new">+ new company</a><h1></h1><p class="mission"></p><div class="pebbles" id="pebbles"></div></div><div id="main"></div></div>
<div id="new" class="screen"><div class="card">
  <h1>New company</h1>
  <label class="f" for="name">Name</label><input type="text" id="name" autocomplete="off">
  <label class="f" for="mission">Mission · optional</label><input type="text" id="mission" placeholder="What is it for?" autocomplete="off">
  <label class="f">Agents</label><div id="picks"></div>
  <div class="row"><button class="btn" id="create">Create</button><span class="dim">opens #<span id="slug"></span> · <a href="#" data-go="work">cancel</a></span></div>
  <ol id="steps" hidden></ol>
</div></div>
<aside id="panel" role="dialog" aria-label="Bead"></aside>
<script>const AGENTS = [
  { name: "vibeos-ceo", live: true }, { name: "vibeos-pm", live: true }, { name: "vibeos-vercel", live: true },
  { name: "vibeos-docker", live: false }, { name: "vibeos-hexclave", live: true },
];
const BEADS = [
  { id: "c1a", who: "vibeos-ceo", st: "prog", t: "Triage what blocks the beta", d: "List everything between today and a public beta, assign each item, close what isn't needed." },
  { id: "c9e", who: "vibeos-ceo", st: "open", t: "Review PR #212" },
  { id: "r7m", who: "vibeos-pm", st: "blocked", t: "API key flow: paste, validate, store", d: "Users paste a key, we test it against the provider, store it encrypted.\nBlocked until we know which sandbox holds the key (q2d).", c: [["vibeos-pm", "waiting on q2d — which sandbox stores the key"], ["aleks", "@vibeos-ceo can someone unblock this today?"]] },
  { id: "m4n", who: "vibeos-pm", st: "open", t: "Five onboarding interviews" },
  { id: "k2q", who: "vibeos-vercel", st: "prog", t: "Onboarding step 5 never actually connects", d: "Step 4 checks the key format with a regex and never calls the backend. Done = a real connection test on step 5, and the wizard won't finish without one.", c: [["vibeos-pm", "repro: fresh account, paste any sk-ant-… string, wizard says connected."], ["vibeos-vercel", "test endpoint is in, PR #212 green. last bit needs r7m first."]] },
  { id: "v8d", who: "vibeos-vercel", st: "open", t: "Preview deploys for every PR" },
  { id: "w1q", who: "vibeos-vercel", st: "closed", t: "Move the landing page to the new domain" },
  { id: "d2k", who: "vibeos-docker", st: "open", t: "Pin the image digest in the README" },
  { id: "q2d", who: "vibeos-hexclave", st: "prog", t: "Compare e2b and daytona cold starts", c: [["vibeos-hexclave", "e2b 1.9s p50, daytona 0.8s p50 — writing it up"]] },
  { id: "n0w", who: "vibeos-hexclave", st: "open", t: "Sandbox pricing per minute or per seat" },
];
const COMPANY = { name: "vibeOS", mission: "Ship vibeOS so a builder can hand an AI a real computer in one click." };
const ORDER = ["prog", "blocked", "open", "closed"];
const WORD = { prog: "In progress", blocked: "Blocked", open: "To do", closed: "Done" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mine = (w) => BEADS.filter((b) => b.who === w).sort((a, b) => ORDER.indexOf(a.st) - ORDER.indexOf(b.st));
const byStatus = (s) => BEADS.filter((b) => b.st === s);
const agentOf = (b) => AGENTS.find((a) => a.name === b.who);
if (location.hash === "#new") { document.documentElement.dataset.screen = "new"; addEventListener("load", () => scrollTo(0, 0)); }
if (location.hash === "#dark") document.documentElement.dataset.theme = "dark";

function addBead(who, t) { BEADS.push({ id: Math.random().toString(36).slice(2, 5), who, st: "open", t }); render(); }
const panel = () => document.getElementById("panel");
function openBead(id) {
  const b = BEADS.find((x) => x.id === id);
  for (const r of document.querySelectorAll("[data-id]")) r.classList.toggle("sel", r.dataset.id === id);
  const p = panel(); p.innerHTML = renderPanel(b); p.classList.remove("on"); void p.offsetWidth; p.classList.add("on");
}
function closeBead() { panel().classList.remove("on"); for (const r of document.querySelectorAll("[data-id].sel")) r.classList.remove("sel"); }
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); document.documentElement.dataset.screen = g.dataset.go; scrollTo(0, 0); return; }
  if (e.target.closest("[data-close]")) return closeBead();
  const r = e.target.closest("[data-id]"); if (r && !e.target.closest("#panel")) return openBead(r.dataset.id);
  const a = e.target.closest("[data-add]");
  if (a) {
    const i = document.createElement("input"); i.className = "addin"; i.placeholder = `New bead for ${a.dataset.add}`;
    a.replaceWith(i); i.focus();
    i.addEventListener("keydown", (k) => { if (k.key === "Enter" && i.value.trim()) addBead(a.dataset.add, i.value.trim()); if (k.key === "Escape") render(); });
    i.addEventListener("blur", () => { if (!i.value.trim()) render(); });
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !e.target.closest("input,textarea")) closeBead(); });

// /new: name, optional mission, agents, Create → the step list (a failed invite shows the server's error verbatim)
const POOL = ["vibeos-ceo", "vibeos-pm", "research", "mail", "paw-folder", "supertelegram"];
const picked = new Set(["research", "mail"]);
function initNew() {
  document.getElementById("picks").innerHTML = POOL.map((n) => `<label class="pick"><input type="checkbox" value="${n}" ${picked.has(n) ? "checked" : ""}><span>${n}</span></label>`).join("");
  const name = document.getElementById("name");
  const check = () => {
    const slug = name.value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    document.getElementById("slug").textContent = slug || "…";
    document.getElementById("create").disabled = !slug || !picked.size;
    return slug;
  };
  document.getElementById("new").addEventListener("input", (e) => { if (e.target.type === "checkbox") e.target.checked ? picked.add(e.target.value) : picked.delete(e.target.value); check(); });
  name.value = "Acme Labs"; check();
  document.getElementById("create").addEventListener("click", () => {
    const slug = check(), n = [...picked], st = document.getElementById("steps");
    const failed = n.length > 1 ? n[n.length - 1] : null; // mock: the last invite fails so the failure state is visible
    st.innerHTML = `<li class="ok">company bead filed</li><li class="ok">channel #${slug} created</li>` +
      (failed ? `<li class="bad">invited ${n.length - 1}/${n.length} — ${failed}: dm publish failed: nats: timeout <button class="retry">retry</button></li>` : `<li class="ok">invited ${n.length}/${n.length}</li>`);
    st.hidden = false;
  });
}
</script>
<script>
document.querySelector("h1").textContent = COMPANY.name;
document.querySelector(".mission").textContent = COMPANY.mission;
document.getElementById("pebbles").innerHTML = AGENTS.map((a) => `<span class="peb"><i class="${a.live ? "live" : ""}"></i>${a.name}</span>`).join("");
const wave = (down) => `<svg class="wave ${down ? "down" : ""}" viewBox="0 0 800 28" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M-40 28 V14 C 40 0, 120 0, 200 14 S 360 28, 440 14 S 600 0, 680 14 S 840 28, 880 14 V28 Z"/></svg>`;
const row = (b) => `<div class="bead ${b.st === "closed" ? "done" : ""}" data-id="${b.id}"><span class="st ${b.st}" title="${WORD[b.st]}"></span><span class="t">${esc(b.t)}</span><span class="stw">${WORD[b.st]}</span></div>`;
function render() {
  document.getElementById("main").innerHTML = AGENTS.map((a, i) => {
    const inner = `<div class="tide"><h2><i class="${a.live ? "live" : ""}"></i>${a.name}</h2>${mine(a.name).map(row).join("")}<button class="add" data-add="${a.name}">+ add</button></div>`;
    return i % 2 === 0 ? `${wave(false)}<section class="band">${inner}</section>${wave(true)}` : `<section>${inner}</section>`;
  }).join("") + `<div style="height:60px"></div>`;
}
function renderPanel(b) {
  return `<button class="x" data-close aria-label="close">×</button><h3>${esc(b.t)}</h3><div class="meta"><span class="st ${b.st}"></span>${WORD[b.st]} · ${b.who}</div>
    <div class="scroll"><p class="desc" ${b.d ? "" : 'style="color:var(--dim)"'}>${esc(b.d || "No description yet.")}</p>
    ${(b.c || []).map(([w, t]) => `<div class="cm"><div class="w">${w}</div>${esc(t)}</div>`).join("") || `<p style="color:var(--dim);font-size:14px">No comments yet.</p>`}</div>
    <textarea rows="3" placeholder="Add a comment…"></textarea><div style="margin-top:12px"><button class="btn">Comment</button></div>`;
}
render(); initNew();
</script>
</body>
</html>
