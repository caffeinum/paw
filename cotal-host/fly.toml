app = "2027-cotal"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  PUBLIC_HOST = "2027-cotal.fly.dev"
  COTAL_SPACE = "team2027"

[[mounts]]
  source = "cotal_data"
  destination = "/data"

# NATS broker: TLS-required, JWT auth (cotal's default). Raw TCP needs the dedicated IPv4.
[[services]]
  protocol = "tcp"
  internal_port = 4222
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 4222

# Only for Let's Encrypt TLS-ALPN-01 (lego listens here briefly at boot and on renewal).
[[services]]
  protocol = "tcp"
  internal_port = 443
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
