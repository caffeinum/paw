app = "2027-cotal"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "30s"

# 512MB went OOM; swap absorbs a transient spike instead of the OOM killer taking the broker.
swap_size_mb = 512

# paw for the optional office bridge (README "Office bridge"); OFFICE_URL / OFFICE_JOIN_KEY are Fly secrets.
[build.args]
  PAW_REF = "fec9610f2b530b4b9dcaac159193dac4d4e90012"

[env]
  PUBLIC_HOST = "2027-cotal.fly.dev"
  COTAL_SPACE = "team2027"
  # Memory budget for the 2GB box (no manager here; nats-server + two node daemons + the cred renewer,
  # with room for an office bridge). Applied live with `fly machine update` on 2026-11-04.
  GOMEMLIMIT = "1400MiB"
  NODE_OPTIONS = "--max-old-space-size=512"

[[mounts]]
  source = "cotal_data"
  destination = "/data"

# NATS broker: TLS-required, JWT auth (cotal's default). Raw TCP needs the dedicated IPv4.
[[services]]
  protocol = "tcp"
  internal_port = 4222
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 4222

# Only for Let's Encrypt TLS-ALPN-01 (lego listens here briefly at boot and on renewal).
[[services]]
  protocol = "tcp"
  internal_port = 443
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[services.ports]]
    port = 443

# A shared core stalled the broker on CPU steal (~60% steal, CPU pressure 43-55%); a dedicated vCPU fixed it.
[[vm]]
  size = "performance-1x"
  memory = "2048mb"

# start.sh stops the broker on purpose to rotate the $SYS creds; the machine must always come back.
[[restart]]
  policy = "always"
